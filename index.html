<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      var t = 'harbor';
      try {
        if (JSON.parse(localStorage.getItem('pc.prefs.v1')).theme === 'light') t = 'light';
      } catch (e) {}
      try {
        if (t === 'harbor') document.documentElement.classList.add('harbor');
      } catch (e) {}
    </script>
    <title>Pallet Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
